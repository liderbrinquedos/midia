services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8000"
    environment:
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      ONEDRIVE_DRIVE_ID: ${ONEDRIVE_DRIVE_ID:-}
      ONEDRIVE_ROOT_ITEM_ID: ${ONEDRIVE_ROOT_ITEM_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MEDIA_INDEX_PATH: /app/backend/data/private/media_index.json
    volumes:
      - midias-data:/app/backend/data/private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 600s
      retries: 3
    stop_grace_period: 30s

volumes:
  midias-data:
